[project]
name = "fridgejam-backend"
version = "0.1.0"
description = "AI-powered Fridge to Recipe Generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "google-genai>=1.14.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.29",
    "slowapi>=0.1.9",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.pytest.ini_options]
# Run pytest from the backend/ directory. pythonpath="." puts backend/ on
# sys.path so tests can `from main import app` (matching the project layout).
pythonpath = ["."]
testpaths = ["tests"]
